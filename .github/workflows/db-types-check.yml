name: DB types drift check

# Supabase here is remote-only (see CLAUDE.md): schema changes go straight to
# the live project via the Supabase MCP tools, often with no corresponding
# push to this repo. ci.yml's "Database types are current" step only runs on
# push/PR, so drift introduced by an out-of-band migration can sit unnoticed
# indefinitely between pushes. This runs the same check on a schedule so it
# doesn't depend on push activity.
on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch: {}

jobs:
  types-check:
    name: database.types.ts matches the live schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Needs SUPABASE_ACCESS_TOKEN (a personal access token from
      # https://supabase.com/dashboard/account/tokens — NOT the service-role
      # key) as a repository secret; see scripts/check-db-types.mjs. Absent,
      # this warns instead of failing, matching ci.yml's equivalent step.
      - name: Database types are current
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=DB types not verified::SUPABASE_ACCESS_TOKEN is not configured, so src/lib/database.types.ts was NOT checked against the live schema."
            exit 0
          fi
          npm run types:check
