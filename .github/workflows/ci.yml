name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 matches the `@types/node: ^20` dev dependency and satisfies
      # Next.js 16's minimum supported runtime.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      # `npm run build` is the ONLY check that catches a sync export in a
      # 'use server' file ("Server Actions must be async functions") — see
      # CLAUDE.md. It must run on every push, never just locally.
      #
      # The Supabase clients are constructed at build time, so the three env
      # vars from .env.example must be present. Real credentials are NOT
      # required to type-check and compile: repository secrets are used when
      # configured, otherwise harmless placeholders keep the build green.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
        run: npm run build

      # Asserts the live database's price-masking and realtime invariants
      # (scripts/db-security.test.ts). These were previously "verified" only by
      # curl commands pasted into migration comments, which is how `anon` kept
      # SELECT on the price columns unnoticed from 1 to 5 Aug 2026.
      #
      # Read-only, and it needs REAL credentials — placeholders make the suite
      # fail by design rather than pass hollowly. If the secrets are not
      # configured, this logs a warning instead of silently succeeding, so an
      # unverified invariant is at least visible in the run.
      # `database.types.ts` is a hand-run snapshot of a remote-only schema —
      # nothing links a migration to a regeneration. A stale snapshot does not
      # break the build; it makes it pass while checking every typed Supabase
      # client, including the price-masked owner views, against a schema that no
      # longer exists. Silent, and indistinguishable from safety.
      #
      # Needs SUPABASE_ACCESS_TOKEN (a personal access token, NOT the
      # service-role key). Absent, this warns rather than passing quietly.
      - name: Database types are current
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=DB types not verified::SUPABASE_ACCESS_TOKEN is not configured, so src/lib/database.types.ts was NOT checked against the live schema."
            exit 0
          fi
          npm run types:check

      - name: Database security posture
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning title=DB posture not verified::Supabase secrets are not configured, so the price-masking invariants were NOT checked in this run."
            exit 0
          fi
          npm run test:db
